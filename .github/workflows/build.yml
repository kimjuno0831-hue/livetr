name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  SHERPA_VER: v1.13.8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 1 Get code
        uses: actions/checkout@v4

      - name: 2 Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3 Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 4 Download sherpa-onnx engine
        run: |
          set -eux
          curl -fL -o libs.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VER}/sherpa-onnx-${SHERPA_VER}-android.tar.bz2"
          mkdir -p libs_tmp
          tar xjf libs.tar.bz2 -C libs_tmp
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v libs_tmp/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 5 Download sherpa-onnx Kotlin code
        run: |
          set -eux
          git clone --depth 1 --branch "${SHERPA_VER}" https://github.com/k2-fsa/sherpa-onnx.git sherpa_src
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp -v sherpa_src/sherpa-onnx/kotlin-api/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/

      - name: 6 Download Chinese speech model (SenseVoice 2025)
        run: |
          set -eux
          mkdir -p app/src/main/assets
          M=sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09
          curl -fL -o sv.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$M.tar.bz2"
          tar xjf sv.tar.bz2 "$M/model.int8.onnx" "$M/tokens.txt"
          mv "$M/model.int8.onnx" app/src/main/assets/model.int8.onnx
          mv "$M/tokens.txt" app/src/main/assets/tokens.txt
          curl -fL -o app/src/main/assets/silero_vad.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          ls -lh app/src/main/assets

      - name: 7 Build the app
        run: gradle assembleDebug --no-daemon --stacktrace -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs=-Xmx3g

      - name: 8 Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          cp app/build/outputs/apk/debug/app-debug.apk LiveTr.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiveTr.apk --title "latest build" --notes "auto build ${{ github.run_number }}" --prerelease
