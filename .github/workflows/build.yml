name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download sherpa-onnx libs, Kotlin API and models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "sherpa-onnx version: $TAG"
          curl -fL -o libs.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/${TAG}/sherpa-onnx-${TAG}-android.tar.bz2"
          mkdir -p libs_tmp
          tar xjf libs.tar.bz2 -C libs_tmp
          find libs_tmp | head -40
          mkdir -p app/src/main/jniLibs/arm64-v8a
          find libs_tmp -path "*arm64-v8a*" -name "*.so" -exec cp -v {} app/src/main/jniLibs/arm64-v8a/ \;
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          git clone --depth 1 --branch "$TAG" https://github.com/k2-fsa/sherpa-onnx.git sherpa_src
          KDIR=$(find sherpa_src -type d -name kotlin-api | head -n 1)
          echo "kotlin-api dir: $KDIR"
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp -v "$KDIR"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/
          mkdir -p app/src/main/assets
          HF=https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          curl -fL -o app/src/main/assets/model.int8.onnx "$HF/model.int8.onnx"
          curl -fL -o app/src/main/assets/tokens.txt "$HF/tokens.txt"
          curl -fL -o app/src/main/assets/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh app/src/main/assets app/src/main/jniLibs/arm64-v8a

      - name: Build APK
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs=-Xmx3g

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveTr.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiveTr.apk --title "latest build" --notes "auto build ${{ github.run_number }}" --prerelease

      - name: Also save as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTr-apk
          path: LiveTr.apk
          retention-days: 2
